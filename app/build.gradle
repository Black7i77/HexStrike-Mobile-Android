plugins { id 'com.android.application' }
android {
    namespace 'com.scarface.hexstrikemobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.scarface.hexstrikemobile'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    defaultConfig { ndk { abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// GGUF must not be compressed in the APK.
android { androidResources { noCompress += ["gguf"] } }
